# ---------- Server ----------
server.port=8080
spring.application.name=pdf-chat


# ---------- Database (H2 file database, only stores PDF details) ----------
spring.datasource.url=jdbc:h2:file:./data/pdfchat;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/updates the table from the Document entity
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=true


# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# ---------- Ollama ----------
spring.ai.ollama.base-url=http://localhost:11434

# LLM used to generate answers
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-ctx=8192

# Embedding model
spring.ai.ollama.embedding.options.model=nomic-embed-text


# ---------- ChromaDB ----------
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000

spring.ai.vectorstore.chroma.collection-name=pdf_chat_documents

# Create Chroma collection automatically if it doesn't exist
spring.ai.vectorstore.chroma.initialize-schema=true


# ---------- Application Settings ----------
# Chunk size
app.chunk-size=800

# Number of overlapping words between chunks
app.chunk-overlap=100

# Number of similar chunks retrieved for each question
app.top-k=5